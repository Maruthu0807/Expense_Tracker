<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Expense Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
    font-family:Arial;
    margin:0;
    text-align:center;
    background:#eef2f7;
}
.page{ padding:30px; }
.hidden{ display:none; }
input, textarea{
    padding:10px;
    margin:8px;
    width:250px;
}
button{
    padding:10px 18px;
    margin:8px;
    border:none;
    border-radius:8px;
    background:#4CAF50;
    color:white;
    font-size:15px;
    cursor:pointer;
}
table{
    border-collapse:collapse;
    margin:auto;
    background:white;
    width:95%;
}
td{
    border:1px solid #ccc;
    height:95px;
    vertical-align:top;
    padding:4px;
}
.date{ font-weight:bold; }
.entry{
    font-size:12px;
    background:#e8f5e9;
    margin:2px;
    padding:2px;
    border-radius:4px;
}
.action{
    cursor:pointer;
    margin-left:6px;
    font-weight:bold;
}
.del{ color:red; padding-left:25px; }
.edit{ color:blue; padding-left:10px; }
.total{
    font-size:18px;
    margin:10px;
    font-weight:bold;
}
.search{
    padding:10px;
    width:250px;
    margin:10px;
}
.topbar{
    background:#222;
    color:white;
    padding:12px 20px;
    height:50px;
    display:flex;
    align-items:center;
    position:relative;
}
#welcome{ position:absolute; left:20px; }
.title{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    font-weight:bold;
    font-size:20px;
}
.logout{
    position:absolute;
    right:20px;
    background:red;
}
.reportBox{
    background:white;
    margin:6px auto;
    padding:10px;
    border-radius:8px;
    width:260px;
    box-shadow:0 0 5px #bbb;
}
.highlight{
    background:#ffe082;
    font-weight:bold;
    border:2px solid orange;
}
#category{
    width:273px;
    height:40px;
    margin:8px 0;
}
@media (max-width: 768px){
body{
    font-size:14px;
}
/* Top bar */
.topbar{
    height:auto;
    flex-direction:column;
    gap:5px;
    text-align:center;
}
#welcome,
.logout,
.title{
    position:static;
    transform:none;
}
/* Inputs */
input, textarea, select{
    width:90%;
    max-width:320px;
}
/* Buttons */
button{
    width:90%;
    max-width:320px;
}
/* Calendar table */
table{
    width:100%;
    font-size:11px;
}
td{
    height:75px;
    padding:2px;
}
/* Entries inside date */
.entry{
    font-size:10px;
    padding:2px;
}
/* Search box */
.search{
    width:90%;
}
/* Report boxes */
.reportBox{
    width:90%;
}
/* Title */
.title{
    font-size:18px;
}
/* Month title */
h3{
    font-size:16px;
}
}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginPage" class="page hidden">
<h2>Login</h2>
<input id="loginUser" placeholder="Username"><br>
<input id="loginPass" type="password"><br>
<button onclick="login()">Login</button>
<button onclick="show('signupPage')">Sign Up</button>
</div>

<!-- ================= SIGNUP ================= -->
<div id="signupPage" class="page hidden">
<h2>Signup</h2>
<input id="newUser" placeholder="Username"><br>
<input id="newPass" type="password"><br>
<button onclick="signup()">Create Account</button>
<button onclick="show('loginPage')">Back</button>
</div>

<!-- ================= APP ================= -->
<div id="appPage" class="hidden">
<div class="topbar">
<span id="welcome"></span>
<div class="title">EXPENSE TRACKER</div>
<button class="logout" onclick="logout()">Logout</button>
</div>
<div class="page">
<button onclick="openForm()">Add Expense</button>
<button onclick="showSection('calendar');draw()">View Calendar</button>

<!-- ================= FORM ================= -->
<div id="form" class="hidden">
<h3>Add Expense</h3>
<input type="date" id="date"><br>
<input type="number" id="amount" placeholder="Amount"><br>
<select id="category">
<option value="">Select Category</option>
<option>Food</option>
<option>Fuel</option>
<option>Grocery</option>
<option>Personal care</option>
<option>Gadgets</option>
<option>Shopping</option>
<option>Rent</option>
<option>Debt</option>
<option>Travel</option>
<option>Bills</option>
<option>Entertainment</option>
<option>Health</option>
<option>Other</option>
</select><br>
<input id="note" list="noteSuggestions" placeholder="Note"><br>
<datalist id="noteSuggestions"></datalist><br>
<button onclick="save()">Save</button>
</div>

<!-- ================= CALENDAR ================= -->
<div id="calendar" class="hidden">
<h3>
<button onclick="changeMonth(-1)">◀</button>
<span id="title"></span>
<button onclick="changeMonth(1)">▶</button>
</h3>
<div style="position:relative;display:inline-block;">
<input id="search" class="search" placeholder="Search..." oninput="draw()">
<span onclick="clearSearch()" style="position:absolute;right:15px;top:50%;transform:translateY(-50%);cursor:pointer;font-weight:bold;color:#888;">×</span>
</div>
<div id="searchTotal"></div>
<button onclick="downloadPDF()">Export PDF</button>
<div class="total" id="total"></div>
<table id="cal"></table>
<div id="dateTotals"></div>
</div>
</div>
</div>

<script>
/* ---------- PAGE SWITCH ---------- */
function show(id){
document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
}

/* ---------- AUTH ---------- */
function signup(){
let u=newUser.value.trim();
let p=newPass.value.trim();
if(!u||!p) return alert("Enter details");
if(localStorage.getItem("user_"+u)) return alert("User exists");
localStorage.setItem("user_"+u,p);
alert("Account created");
show("loginPage");
}

function login(){
let u=loginUser.value.trim();
let p=loginPass.value.trim();
if(localStorage.getItem("user_"+u)===p){
localStorage.setItem("loggedUser",u);
startApp();
}else alert("Invalid login");
}

function logout(){
localStorage.removeItem("loggedUser");
location.reload();
}

/* ---------- START APP ---------- */
function startApp(){
let u=localStorage.getItem("loggedUser");
if(!u){ show("loginPage"); return; }
loginPage.classList.add("hidden");
signupPage.classList.add("hidden");
appPage.classList.remove("hidden");
welcome.innerText="Welcome "+u;
showSection("form");
setToday();
loadNoteSuggestions();
}
startApp();

/* ---------- FORM ---------- */
function setToday(){
date.value=new Date().toISOString().split("T")[0];
}

function openForm(){
showSection("form");
setToday();
loadNoteSuggestions();
}

function showSection(id){
document.querySelectorAll("#form,#calendar").forEach(d=>d.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
}

/* ---------- SAVE ---------- */
function save(){
let d=date.value;
let amt=amount.value;
let noteText=note.value.trim();
let cat=category.value;
if(!d||!amt||!noteText||!cat)
return alert("Fill all fields");
let user=localStorage.getItem("loggedUser");
let key="data_"+user;
let data=JSON.parse(localStorage.getItem(key)||"{}");
if(!data[d]) data[d]=[];
data[d].push({amount:amt,note:noteText,category:cat});
localStorage.setItem(key,JSON.stringify(data));
alert("Saved");
amount.value="";
note.value="";
category.value="";
loadNoteSuggestions();
}

/* ---------- CALENDAR ---------- */
let current=new Date();
function changeMonth(n){
current.setMonth(current.getMonth()+n);
draw();
}

function formatDate(d){
let dt=new Date(d);
return String(dt.getDate()).padStart(2,"0")+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+dt.getFullYear();
}

function draw(){
let table=cal;
table.innerHTML="";
let year=current.getFullYear();
let month=current.getMonth();
title.innerText=current.toLocaleString("default",{month:"long",year:"numeric"});
let first=new Date(year,month,1).getDay();
let days=new Date(year,month+1,0).getDate();
let user=localStorage.getItem("loggedUser");
let data=JSON.parse(localStorage.getItem("data_"+user)||"{}");
let search=document.getElementById("search").value.toLowerCase();
let total=0;
let searchTotal=0;
let row=document.createElement("tr");
for(let i=0;i<first;i++)
row.appendChild(document.createElement("td"));
for(let d=1; d<=days; d++){
if(row.children.length==7){
table.appendChild(row);
row=document.createElement("tr");
}
let cell=document.createElement("td");
let dt=document.createElement("div");
dt.className="date";
dt.textContent=d;
cell.appendChild(dt);
let key=year+"-"+String(month+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
if(data[key]){
data[key].forEach((e,i)=>{
let combined=(e.amount+" "+e.note+" "+e.category).toLowerCase();
if(combined.includes(search)){
total+=Number(e.amount);
searchTotal+=Number(e.amount);
let div=document.createElement("div");
div.className="entry";
div.innerHTML=
`<b>${e.category}</b>: ₹${e.amount} - ${e.note}
<span class="action edit" onclick="editEntry('${key}',${i})">✎</span>
<span class="action del" onclick="del('${key}',${i})">×</span>`;
cell.appendChild(div);
}
});
}
row.appendChild(cell);
}
table.appendChild(row);

/* FIXED TOTAL DISPLAY */
document.getElementById("total").innerText="Monthly Total: ₹"+total;
document.getElementById("searchTotal").innerText= search ? "Search Total: ₹"+searchTotal : "";

/* ---------- DATE TOTALS ---------- */
let html="<h3>Date-wise Total</h3>";
let overall=0;
let maxAmount=0;
let maxDate="";
let monthlyData={};
Object.keys(data).forEach(d=>{
let dt=new Date(d);
if(dt.getMonth()!=month||dt.getFullYear()!=year) return;
let sum=0;
data[d].forEach(e=>sum+=Number(e.amount));
monthlyData[d]=sum;
if(sum>maxAmount){
maxAmount=sum;
maxDate=d;
}
});
Object.keys(monthlyData).sort().forEach(d=>{
let sum=monthlyData[d];
overall+=sum;
let highlight=d===maxDate?"highlight":"";
let label=d===maxDate?" ⭐ Highest":"";
html+=`<div class="reportBox ${highlight}">
${formatDate(d)} — ₹${sum}${label}
</div>`;
});
html+=`<h3>Overall Total: ₹${overall}</h3>`;
dateTotals.innerHTML=html;
}

/* ---------- DELETE ---------- */
function del(date,index){
let user=localStorage.getItem("loggedUser");
let key="data_"+user;
let data=JSON.parse(localStorage.getItem(key));
data[date].splice(index,1);
if(data[date].length==0) delete data[date];
localStorage.setItem(key,JSON.stringify(data));
draw();
}

/* ---------- EDIT ---------- */
function editEntry(date,index){
let user=localStorage.getItem("loggedUser");
let key="data_"+user;
let data=JSON.parse(localStorage.getItem(key));
let entry=data[date][index];
let a=prompt("Edit amount",entry.amount);
let n=prompt("Edit note",entry.note);
if(a&&n){
data[date][index]={amount:a,note:n};
localStorage.setItem(key,JSON.stringify(data));
draw();
}
}

/* ---------- SEARCH CLEAR ---------- */
function clearSearch(){
document.getElementById("search").value="";
draw();
}

/* ---------- NOTE SUGGESTIONS ---------- */
function loadNoteSuggestions(){
let user=localStorage.getItem("loggedUser");
let data=JSON.parse(localStorage.getItem("data_"+user)||"{}");
let notes=new Set();
Object.values(data).forEach(arr=>{
arr.forEach(e=>notes.add(e.note));
});
let list=document.getElementById("noteSuggestions");
list.innerHTML="";
notes.forEach(n=>{
let option=document.createElement("option");
option.value=n;
list.appendChild(option);
});
}

/* ---------- PDF EXPORT ---------- */
async function downloadPDF(){
const { jsPDF } = window.jspdf;
const doc = new jsPDF();
let user=localStorage.getItem("loggedUser");
let data=JSON.parse(localStorage.getItem("data_"+user)||"{}");
let year=current.getFullYear();
let month=current.getMonth();
let title=current.toLocaleString("default",{month:"long",year:"numeric"});

/* PAGE 1 HEADER */
doc.setFontSize(18);
doc.text("Expense Report",105,20,null,null,"center");
doc.setFontSize(12);
doc.text(title,105,30,null,null,"center");

/* TABLE HEADER */
let y=45;
doc.setFont(undefined,"bold");
doc.text("Date",20,y);
doc.text("Amount",70,y);
doc.text("Category",120,y);
doc.text("Note",160,y);
y+=5;
doc.line(20,y,190,y);
y+=10;
doc.setFont(undefined,"normal");
let total=0;
let found=false;

/* TABLE ROWS */
Object.keys(data).sort().forEach(d=>{
let dt=new Date(d);
if(dt.getMonth()!=month||dt.getFullYear()!=year) return;
data[d].forEach(e=>{
found=true;
doc.text(formatDate(d),20,y);
doc.text("Rs."+e.amount,70,y);
doc.text(e.category,120,y);
doc.text(e.note,160,y);
total+=Number(e.amount);
y+=10;
if(y>270){
doc.addPage();
y=20;
}
});
});

/* NO DATA */
if(!found){
doc.text("No records found.",20,y);
y+=10;
}

/* TOTAL */
y+=5;
doc.line(20,y,190,y);
y+=10;
doc.setFont(undefined,"bold");
doc.text("Total Expense: Rs."+total,20,y);


/* ================= PAGE 2 ================= */

doc.addPage();
doc.setFontSize(16);
doc.text("Category Report",105,20,null,null,"center");
doc.setFontSize(12);
let categories={};

/* CALCULATE CATEGORY TOTALS */
Object.keys(data).forEach(d=>{
let dt=new Date(d);
if(dt.getMonth()!=month||dt.getFullYear()!=year) return;
data[d].forEach(e=>{
let cat=e.category||"Other";
let note=e.note||"";
if(!categories[cat])
categories[cat]={total:0,notes:{}};
categories[cat].total+=Number(e.amount);
if(!categories[cat].notes[note])
categories[cat].notes[note]=0;
categories[cat].notes[note]+=Number(e.amount);
});
});
let y2=40;

/* CATEGORY PRINT */
Object.keys(categories).sort().forEach(cat=>{
doc.setFont(undefined,"bold");
doc.text(cat+" — Rs."+categories[cat].total,20,y2);
y2+=8;
doc.setFont(undefined,"normal");
Object.keys(categories[cat].notes).forEach(n=>{
doc.text("   "+n+" — Rs."+categories[cat].notes[n],25,y2);
y2+=7;
if(y2>270){
doc.addPage();
y2=20;
}
});
y2+=5;
});

/* FOOTER */
doc.setFontSize(10);
doc.text("Generated by Expense Tracker",105,290,null,null,"center");

/* SAVE */
doc.save("Expense_Report.pdf");
}
</script>
</body>
</html>
